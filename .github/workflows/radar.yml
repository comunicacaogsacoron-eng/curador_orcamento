name: Radar do Orçamento

on:
  schedule:
    # 12:00 UTC = 09:00 no horário de Brasília (manhã).
    - cron: "0 12 * * *"
  workflow_dispatch: {}  # permite rodar manualmente pelo botão "Run workflow"

jobs:
  radar:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Configurar Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Instalar dependências
        run: pip install -r requirements.txt

      - name: Rodar o radar
        env:
          OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          # Opcional: descomente para fixar/trocar o modelo
          # OPENROUTER_MODEL: anthropic/claude-opus-4.8
        run: python radar.py
